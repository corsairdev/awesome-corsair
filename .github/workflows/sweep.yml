name: sweep

# Every three days: find new repos built on Corsair, have Claude grade them against CONTRIBUTING.md, and put the
# drafts in one pull request on the sweep/next branch. Nothing merges on its own: every drafted entry is
# `verified: false` until a maintainer opens the link and checks the evidence. Run it by hand from the Actions tab.
#
# Needs the ANTHROPIC_API_KEY repo secret. GITHUB_TOKEN is the workflow's own (code search needs a token).
# A pull request opened with GITHUB_TOKEN doesn't start other workflows, so ci.yml doesn't run on it; this job runs
# the same build itself.

on:
  schedule:
    - cron: "23 6 */3 * *"
  workflow_dispatch:
    inputs:
      max_candidates:
        description: How many new repos to grade in this run
        default: "25"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from the open sweep branch, if there is one
        run: |
          git config user.name "awesome-corsair sweep"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin sweep/next > /dev/null; then
            git fetch origin sweep/next
            git checkout -B sweep/next origin/sweep/next
            git rebase origin/main || { git rebase --abort; git checkout -B sweep/next origin/main; }
          else
            git checkout -B sweep/next
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/sweep/package-lock.json

      - run: npm ci
        working-directory: tools/sweep

      - name: Find and grade new repos
        run: node tools/sweep/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_CANDIDATES: ${{ inputs.max_candidates || '25' }}

      - name: Rebuild the README
        run: node scripts/build.mjs

      - name: Push, then open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add data README.md
          if git diff --cached --quiet; then
            echo "Nothing new this run."
            exit 0
          fi
          git commit -m "sweep: $(date -u +%F)"
          git push --force-with-lease origin sweep/next
          # Only entries make a pull request worth opening; a run that only rejected repos just keeps its record.
          if git diff --quiet origin/main -- data/projects.yaml; then
            echo "No new entries, the grading record is saved on sweep/next."
            exit 0
          fi
          open=$(gh pr list --head sweep/next --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr comment "$open" --body-file sweep-summary.md
            exit 0
          fi
          if gh pr create --base main --head sweep/next --title "New projects built on Corsair" --body-file sweep-summary.md; then
            exit 0
          fi
          # The corsairdev org doesn't let Actions open pull requests (Settings > Actions > General). Until an org
          # admin allows it, the drafts wait on sweep/next and an issue links to them; one click opens the pull request.
          compare="https://github.com/${GITHUB_REPOSITORY}/compare/main...sweep/next?expand=1"
          { echo "New drafts are on \`sweep/next\`. [Open the pull request]($compare) to review them."; echo; cat sweep-summary.md; } > sweep-issue.md
          issue=$(gh issue list --state open --search "in:title Sweep found new projects" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file sweep-issue.md
          else
            gh issue create --title "Sweep found new projects to review" --body-file sweep-issue.md
          fi
